<!DOCTYPE html>
 <html lang="es">
    <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <meta name="author" content="Juan Garcia Cohorte webft78">
      <title>✨ Colorfly studio-Paleta de colores</title>
      <link rel="preconnect" href="https://fonts.googleapis.com">
      <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
      <link href="https://fonts.googleapis.com/css2?family=The+Nautigal:wght@400;700&display=swap" rel="stylesheet">
      <link rel="stylesheet" href="ASSETS_PALETA/CSS/STYLE_PALETA.css">
    </head>
    <body>
      <header>
        <h1>Generador de paletas</h1>
        <h2>By Colorfly Studio</h2>
      </header>
      <main>
       <section>
         <label for="selector">Tamaño de paleta</label>
           <select id="selector">
            <option value="6">6 Colores</option>
            <option value="8">8 Colores</option>
            <option value="9">9 Colores</option>
           </select>
         <button type="button">Generar paleta</button>
         <label class="switcher">
              <input type="checkbox" id="change-color">
              <span title="Activar / Desactivar HSL">HSL</span>
          </label>
         <p class="microfeedback" aria-live="polite"></p>
       </section>
       <div class="container-paleta"></div>
      </main>
      <footer>
        <p>Colorfly studio - Generador de paletas de colores © 2026</p>
        <p>made by Juan Garcia</p>
        <a href="https://github.com/jmgc9601-pixel" target="_blank">GitHub</a>
      </footer>
      <script src="ASSETS_PALETA/JavaScript/APP_PALETA.js"></script> 
    </body>
 </html>
